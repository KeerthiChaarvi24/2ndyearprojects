<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="result-container">
        <div class="result-card">
            <h1>QUIZ COMPLETE!</h1>

            <div class="result-message">
                WELL DONE, {{ username }}!
            </div>

            <div class="score">
                {{ score }}/10
            </div>

            <div class="result-message">
                YOU SURVIVED THE SOLVIFY CHALLENGE!
            </div>

            <a href="/leaderboard">
                <button class="restart-button">SEE LEADERBOARD</button>
            </a>

            <a href="/">
                <button class="restart-button">PLAY AGAIN</button>
            </a>
        </div>
    </div>
</body>
</html>
